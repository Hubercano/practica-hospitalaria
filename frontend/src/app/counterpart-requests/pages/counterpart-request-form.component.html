<div class="max-w-4xl mx-auto p-4">
  <div class="mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">Nueva Contraprestación</h1>
      <p class="mt-1 text-sm text-slate-600">Crea una solicitud dirigida a una institución y adjunta el archivo xlsx.</p>
    </div>
    <app-button variant="secondary" routerLink="/counterpart-requests">Volver al listado</app-button>
  </div>

  <app-card>
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <app-form-field label="Nombre de la solicitud" [required]="true">
          <app-input formControlName="name" placeholder="Ej: Contraprestación semestre 2026-1"></app-input>
        </app-form-field>

        <app-form-field label="Institución" [required]="true">
          <app-select formControlName="institutionId" [options]="institutionOptions" placeholder="Selecciona una institución"></app-select>
        </app-form-field>
      </div>

      <app-form-field label="Descripción" [required]="true">
        <textarea
          formControlName="description"
          placeholder="Describe el alcance de la solicitud"
          class="block w-full rounded-[10px] border-slate-300 text-sm"
        ></textarea>
      </app-form-field>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">
          Montar archivo xlsx con la información de las personas que solicitan la contraprestación
        </label>
        <app-file-upload accept=".xlsx" (fileChanged)="onFileSelected($event[0])"></app-file-upload>
      </div>

      <div class="pt-4 border-t border-slate-200 flex justify-end gap-3">
        <app-button type="button" variant="secondary" routerLink="/counterpart-requests">Cancelar</app-button>
        <app-button variant="primary" type="submit" [disabled]="form.invalid || !selectedFile || isSubmitting">
          {{ isSubmitting ? 'Guardando...' : 'Crear Solicitud' }}
        </app-button>
      </div>
    </form>
  </app-card>
</div>
