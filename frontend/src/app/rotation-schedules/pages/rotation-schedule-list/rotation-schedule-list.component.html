<div class="mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h2 class="text-2xl font-bold text-slate-900">Programación de Rotaciones</h2>
      <p class="mt-1 text-sm text-slate-500">Gestiona las programaciones de rotación por programa y área.</p>
    </div>
    <div class="flex gap-4">
      <app-button variant="primary" (click)="openModal()">Programar rotación</app-button>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    <app-table [data]="schedules()" [columns]="columns" (edit)="onViewDetail($event)" (delete)="onDelete($event)"></app-table>
  </div>

  @if (showModal) {
    <app-modal [isOpen]="true" [title]="editingScheduleId ? 'Ver detalle / Editar rotación' : 'Programar rotación'" (closeEvent)="closeModal()">
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <app-form-field label="Institución">
          <ng-select [items]="institutions" bindLabel="name" bindValue="id" formControlName="institutionId" placeholder="Seleccione institución"></ng-select>
        </app-form-field>

        <app-form-field label="Programa">
          <ng-select [items]="programs" bindLabel="name" bindValue="id" formControlName="programId" placeholder="Seleccione programa" [disabled]="!form.get('institutionId')?.value"></ng-select>
        </app-form-field>

        <app-form-field label="Área">
          <ng-select [items]="areas" bindLabel="name" bindValue="id" formControlName="areaId" placeholder="Seleccione área" [disabled]="!form.get('programId')?.value"></ng-select>
        </app-form-field>

        <app-form-field label="Docentes">
          <ng-select [items]="teachers" bindLabel="fullName" bindValue="id" [multiple]="true" formControlName="teacherIds" placeholder="Seleccione docentes" [disabled]="!form.get('areaId')?.value"></ng-select>
        </app-form-field>

        <app-form-field label="Estudiantes">
          <ng-select [items]="students" bindLabel="fullName" bindValue="id" [multiple]="true" formControlName="studentIds" placeholder="Seleccione estudiantes" [disabled]="!form.get('areaId')?.value"></ng-select>
        </app-form-field>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <app-form-field label="Fecha inicio">
            <input type="date" formControlName="startDate" class="w-full" [disabled]="!form.get('areaId')?.value" />
          </app-form-field>
          <app-form-field label="Fecha fin">
            <input type="date" formControlName="endDate" class="w-full" [disabled]="!form.get('areaId')?.value" />
          </app-form-field>
        </div>

        <div class="flex justify-end gap-3">
          <app-button variant="secondary" (click)="closeModal()">Cancelar</app-button>
          <app-button variant="primary" type="submit">{{ isSubmitting ? 'Guardando...' : (editingScheduleId ? 'Actualizar' : 'Programar') }}</app-button>
        </div>
      </form>
    </app-modal>
  }
</div>
