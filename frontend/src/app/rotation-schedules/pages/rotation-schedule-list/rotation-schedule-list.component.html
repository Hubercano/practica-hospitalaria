<div class="mx-auto p-4">
  <div class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h2 class="text-2xl font-bold text-slate-900">Programación de Rotaciones</h2>
      <p class="mt-1 text-sm text-slate-500">Gestiona las programaciones de rotación por programa y área.</p>
    </div>
    <div class="flex gap-4">
      <app-button variant="secondary" (click)="toggleFiltersPanel()" customClass="!rounded-xl border-slate-200">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 01.8 1.6L14 13.5V19a1 1 0 01-1.447.894l-2-1A1 1 0 0110 18v-4.5L3.2 4.6A1 1 0 013 4z"></path></svg>
        {{ showFilters ? 'Ocultar Filtros' : 'Filtros' }}
      </app-button>
      <app-button variant="primary" (click)="goToCreate()">Programar rotación</app-button>
    </div>
  </div>

  @if (showFilters) {
    <div class="mb-6 rounded-2xl border border-slate-200 bg-white shadow-sm p-4 md:p-5">
      <form [formGroup]="filtersForm" class="space-y-4" (ngSubmit)="applyFilters()">
        <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1.5">Institución</label>
            <ng-select [items]="filterInstitutionOptions" [multiple]="true" [closeOnSelect]="false" [searchable]="true" [clearable]="true" [hideSelected]="true" placeholder="Todas" formControlName="institutions" class="w-full filter-ng-select"></ng-select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1.5">Programa</label>
            <ng-select [items]="filterProgramOptions" [multiple]="true" [closeOnSelect]="false" [searchable]="true" [clearable]="true" [hideSelected]="true" placeholder="Todos" formControlName="programs" class="w-full filter-ng-select"></ng-select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1.5">Área</label>
            <ng-select [items]="filterAreaOptions" [multiple]="true" [closeOnSelect]="false" [searchable]="true" [clearable]="true" [hideSelected]="true" placeholder="Todas" formControlName="areas" class="w-full filter-ng-select"></ng-select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1.5">Servicios</label>
            <input type="text" formControlName="serviceText" placeholder="Buscar en servicios" class="block w-full rounded-lg border-slate-300 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1.5">Docentes</label>
            <input type="text" formControlName="teacherText" placeholder="Buscar docente" class="block w-full rounded-lg border-slate-300 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1.5">Estudiantes</label>
            <input type="text" formControlName="studentText" placeholder="Buscar estudiante" class="block w-full rounded-lg border-slate-300 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1.5">Inicio (desde)</label>
            <input type="date" formControlName="startDate" class="block w-full rounded-lg border-slate-300 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wide mb-1.5">Fin (hasta)</label>
            <input type="date" formControlName="endDate" class="block w-full rounded-lg border-slate-300 text-sm" />
          </div>
        </div>

        <app-filter-chips [chips]="activeChips" (removeChip)="removeChip($event)"></app-filter-chips>

        <div class="pt-2 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <app-button type="button" variant="secondary" (click)="exportCurrentTableData()" customClass="!rounded-xl border-slate-200 shrink-0">Exportar datos</app-button>
          </div>
          <div class="flex items-center justify-end gap-3 flex-wrap">
            <app-button type="button" variant="secondary" (click)="clearFilters()" customClass="!rounded-xl border-slate-200">Limpiar filtros</app-button>
            <app-button type="submit" variant="primary" customClass="!rounded-xl">Filtrar</app-button>
          </div>
        </div>
      </form>
    </div>
  }

  <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    <app-table [data]="schedules()" [columns]="columns" (edit)="onViewDetail($event)" (delete)="onDelete($event)"></app-table>
  </div>
</div>
