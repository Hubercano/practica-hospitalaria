<div class="h-screen flex bg-gray-50">
  <aside class="w-sidebar bg-sidebar-bg flex flex-col h-full shadow-lg z-20 print:hidden relative">
    <div class="h-header flex items-center px-6">
      <div class="flex items-center gap-3 w-full border-b border-gray-800/50 pb-4 mt-4">
        <div class="w-8 h-8 rounded-lg bg-brand-button flex items-center justify-center text-white shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
        </div>
        <span class="text-white font-semibold text-lg tracking-tight">Práctica Hosp.</span>
      </div>
    </div>

    <nav class="app-scrollbar-sidebar flex-1 overflow-y-auto py-6 px-4">
      <div class="space-y-6">
        @for (group of menuGroups(); track group.title) {
          <div>
            <h3 class="px-3 text-xs font-semibold text-sidebar-text uppercase tracking-wider mb-2">{{ group.title }}</h3>
            <ul class="space-y-1">
              @for (item of group.items; track item.route) {
                <li>
                  <a
                    [routerLink]="item.route"
                    routerLinkActive="bg-brand-active text-white rounded-lg shadow-sm font-medium"
                    [routerLinkActiveOptions]="{ exact: false }"
                    class="flex items-center px-3 py-2.5 text-sm text-sidebar-text hover:bg-sidebar-hover hover:text-gray-100 rounded-lg transition-colors group"
                  >
                    <svg class="mr-3 shrink-0 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.iconPath"></path></svg>
                    {{ item.label }}
                  </a>
                </li>
              }
            </ul>
          </div>
        }
      </div>
    </nav>

    <div class="px-4 pb-4 mt-auto">
      <button
        type="button"
        (click)="logout()"
        class="w-full rounded-xl border border-white/10 text-sidebar-text px-3 py-2.5 text-sm hover:bg-sidebar-hover transition-colors"
      >
        Cerrar sesión
      </button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0 bg-white">
    <header class="h-header bg-white border-b border-gray-100 flex items-center justify-end px-6 shadow-header z-10 print:hidden shrink-0">
      <div class="flex items-center gap-3">
        <div class="flex flex-col items-end">
          <span class="text-sm font-semibold text-gray-900">{{ currentUser()?.email || 'Usuario' }}</span>
          <span class="text-xs text-gray-500">{{ roleLabel() }}</span>
        </div>
        <div class="w-10 h-10 rounded-full bg-brand-button flex items-center justify-center text-white font-medium text-sm">
          {{ initials() }}
        </div>
      </div>
    </header>

    <main class="app-scrollbar flex-1 overflow-y-auto w-full bg-gray-50/30">
      <div class="mx-auto w-full pb-12 h-full">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
