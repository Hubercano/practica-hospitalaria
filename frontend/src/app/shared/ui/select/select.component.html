<div class="relative">
      <select
        [disabled]="disabled()"
        [value]="value"
        (change)="onChangeEvent($event)"
        (blur)="onTouched()"
        class="block w-full appearance-none border bg-slate-100 rounded-[10px] py-2.5 pl-3 pr-9 text-slate-900 text-sm focus:outline-none focus:bg-white focus:ring-2 focus:ring-[#5C4DFF] focus:shadow-sm transition-all"
        [ngClass]="{'ring-2 ring-rose-500 bg-rose-50': error()}"
        [attr.id]="selectId"
      >
        <option value="" disabled selected hidden>{{ placeholder() }}</option>
        @for (opt of options(); track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
      <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </div>
    </div>
