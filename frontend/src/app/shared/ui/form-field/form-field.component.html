<div class="flex flex-col mb-1 w-full">
      @if (label()) {
        <label [attr.for]="forId()" class="block text-xs font-semibold text-slate-800 mb-1.5">
          {{ label() }}
          @if (required()) {
            <span class="text-rose-500 ml-0.5">*</span>
          }
        </label>
      }
      <ng-content></ng-content>
      @if (hint() && !error()) {
        <p class="mt-1 text-xs text-slate-500">{{ hint() }}</p>
      }
      @if (error()) {
        <p class="mt-1 text-xs font-medium text-rose-500">{{ error() }}</p>
      }
    </div>
