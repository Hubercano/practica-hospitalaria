<div class="flex flex-col mb-1 w-full">
      @if (label()) {
        <label [attr.for]="forId()" class="block text-[13px] font-bold text-slate-800 mb-2">
          {{ label() }}
          @if (required()) {
            <span class="text-rose-500 ml-0.5">*</span>
          }
        </label>
      }
      <ng-content></ng-content>
      @if (hint() && !error()) {
        <p class="mt-1.5 text-[13px] text-slate-500">{{ hint() }}</p>
      }
      @if (error()) {
        <p class="mt-1.5 text-[13px] font-medium text-rose-500">{{ error() }}</p>
      }
    </div>
