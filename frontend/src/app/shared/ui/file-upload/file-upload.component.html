<div 
      class="border-2 border-dashed border-slate-300 rounded-2xl bg-slate-50/50 p-8 text-center transition-colors duration-200"
      [class.border-[#5C4DFF]]="isDragging"
      [class.bg-indigo-50]="isDragging"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
    >
      <input
        type="file"
        [id]="id()"
        [accept]="accept()"
        [multiple]="multiple()"
        class="hidden"
        #fileInput
        (change)="onFileSelected($event)"
      />
      
      <div class="flex flex-col items-center justify-center space-y-3">
        <div class="h-12 w-12 bg-[#5C4DFF]/10 text-[#5C4DFF] rounded-full flex items-center justify-center">
            <i class="fas fa-cloud-upload-alt text-xl"></i>
        </div>
        <div class="text-[13px] text-slate-500 font-medium">
          <span class="text-[#5C4DFF] font-semibold cursor-pointer hover:underline" (click)="fileInput.click()">
            Haz clic para subir
          </span>
          o arrastra y suelta tu archivo aquí
        </div>
        <p class="text-xs text-slate-400">Archivos soportados: {{ accept() || 'Cualquiera' }}</p>
      </div>

      @if (files.length > 0) {
        <div class="mt-6 flex flex-col gap-2">
          @for (file of files; track file.name) {
            <div class="flex items-center justify-between p-3 bg-white border border-slate-100 rounded-xl shadow-sm">
                <div class="flex items-center gap-3">
                    <i class="fas fa-file-alt text-slate-400"></i>
                    <span class="text-sm font-medium text-slate-700">{{ file.name }}</span>
                </div>
                <button 
                  (click)="removeFile(file)"
                  class="text-slate-400 hover:text-rose-500 transition-colors p-1"
                >
                    <i class="fas fa-times"></i>
                </button>
            </div>
          }
        </div>
      }
    </div>
