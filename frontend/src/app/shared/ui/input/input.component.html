<input
      [type]="type()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [value]="value"
      (input)="onInput($event)"
      (blur)="onTouched()"
  class="block w-full border bg-slate-100 rounded-[10px] py-2.5 px-3 text-slate-900 text-sm placeholder:text-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-[#5C4DFF] focus:shadow-sm transition-all"
      [ngClass]="{'ring-2 ring-rose-500 bg-rose-50': error()}"
      [attr.id]="inputId"
    >
