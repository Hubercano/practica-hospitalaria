<div class="max-w-3xl mx-auto p-4">
  <div class="mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h2 class="text-2xl font-bold text-slate-900">{{ isEditMode ? 'Editar Usuario' : 'Nuevo Usuario' }}</h2>
      <p class="mt-1 text-sm text-slate-600">Configura el acceso al sistema para usuarios hospital o institución.</p>
    </div>
    <app-button variant="secondary" routerLink="/users" size="sm">Volver al listado</app-button>
  </div>

  <app-card>
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <app-form-field label="Correo" [required]="true">
          <app-input type="email" formControlName="email" placeholder="usuario@dominio.com"></app-input>
        </app-form-field>
        <app-form-field label="Contraseña" [required]="!isEditMode">
          <app-input type="password" formControlName="password" [placeholder]="isEditMode ? 'Dejar en blanco para no cambiar' : 'Mínimo 12 caracteres'"></app-input>
        </app-form-field>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <app-form-field label="Rol" [required]="true">
          <app-select formControlName="role" [options]="roleOptions"></app-select>
        </app-form-field>
        <app-form-field label="Estado" [required]="true">
          <app-select formControlName="status" [options]="statusOptions"></app-select>
        </app-form-field>
      </div>

      @if (requiresInstitution) {
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <app-form-field label="Institución" [required]="true">
            <app-select formControlName="institutionId" [options]="institutionOptions" placeholder="Selecciona una institución"></app-select>
          </app-form-field>
        </div>
      }

      <div class="pt-4 border-t border-slate-200 flex justify-end gap-3">
        <app-button type="button" variant="secondary" routerLink="/users">Cancelar</app-button>
        <app-button variant="primary" type="submit" [disabled]="form.invalid || isSubmitting">
          {{ isSubmitting ? 'Guardando...' : (isEditMode ? 'Actualizar Usuario' : 'Crear Usuario') }}
        </app-button>
      </div>
    </form>
  </app-card>
</div>
