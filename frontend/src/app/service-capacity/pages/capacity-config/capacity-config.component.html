<div class="max-w-4xl mx-auto p-6 bg-white rounded-lg shadow">
      <h2 class="text-2xl font-bold mb-6 text-slate-800">Módulo 4: Capacidad Instalada por Servicio</h2>
      
      <form [formGroup]="capacityForm" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <!-- Service Selection -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Servicio Habilitado (Del Catálogo)</label>
          <select formControlName="serviceId" 
                  class="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
            <option value="">Seleccione un servicio...</option>
            @for (service of services(); track service.id) {
              <option [value]="service.id">{{ service.name }} ({{ service.code }})</option>
            }
          </select>
        </div>

        <!-- Selected Service Details (ReadOnly) -->
        @if (selectedService()) {
          <div class="bg-slate-50 p-4 rounded-md border border-slate-200">
            <p class="text-sm text-slate-600">Código del servicio seleccionado: <span class="font-bold">{{ selectedService()?.code }}</span></p>
          </div>
        }

        <!-- Capacity Config -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Distintivo / Código Habilitación</label>
            <input type="text" formControlName="distinctiveCode" 
                   class="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Capacidad (Estudiantes)</label>
            <input type="number" formControlName="capacity" min="1"
                   class="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Grupo de Capacidad (Opcional)</label>
          <input type="text" formControlName="capacityGroup" placeholder="Ej: Hospitalización General"
                 class="w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
        </div>

        <div class="flex justify-end">
          <button type="submit" [disabled]="capacityForm.invalid"
                  class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 disabled:bg-blue-300">
            Guardar Configuración
          </button>
        </div>
      </form>
    </div>
